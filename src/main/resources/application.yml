server:
  port: 8080

app:
  node-id: home-pilot-001

spring:
  application:
    name: home-pilot
  profiles:
    active: local-vm
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/iot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    # ========== HikariCP 连接池生产级配置 ==========
    hikari:
      # 连接池名称（便于监控和日志识别）
      pool-name: home-pilot-hikari
      # 最大连接数（根据 MySQL max_connections 和业务并发量调整）
      maximum-pool-size: 20
      # 最小空闲连接数（保持预热，避免突发流量时冷启动建连开销）
      minimum-idle: 5
      # 获取连接最大等待时间（超时抛 SQLException）
      connection-timeout: 30000
      # 空闲连接存活最大时间（MySQL wait_timeout 必须大于此值，建议 MySQL 侧设 600s+）
      idle-timeout: 600000
      # 连接最大生命周期（必须小于 MySQL wait_timeout，防止使用已被服务端关闭的死连接）
      max-lifetime: 1800000
      # 连接有效性检测 SQL（MySQL 推荐用此轻量级语句）
      connection-test-query: SELECT 1
      # 自动提交行为
      auto-commit: true
      # 连接泄漏检测阈值（超过此时间未归还的连接视为泄漏，0=禁用）
      leak-detection-threshold: 60000
  data:
    redis:
      host: localhost
      port: 6379
      # password:
      password: 123
      database: 0
      # 命令响应超时（读取数据时最大等待时间）
      timeout: 3000ms
      # TCP 连接建立超时（握手阶段）
      connect-timeout: 3000ms
      # 客户端名称，便于在 Redis INFO clients 中识别来源
      client-name: home-pilot
      lettuce:
        pool:
          # 连接池最大连接数（根据业务并发量调整，IoT 场景设备状态读写频繁）
          max-active: 16
          # 最大空闲连接（长期保持的可回收连接数）
          max-idle: 8
          # 最小空闲连接（预热保活，避免突发流量时冷启动建连）
          min-idle: 2
          # 从连接池获取连接的最大等待时间，超时抛异常
          max-wait: 2000ms
        # 关闭超时：优雅关闭连接时等待命令完成的最大时间
        shutdown-timeout: 200ms
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    consumer:
      group-id: backend-group-iot
      enable-auto-commit: false # 关闭自动提交！业务处理完手动commit
      auto-offset-reset: latest
      max-poll-records: 200 # 一次拉取一批消息，方便批量写influxdb
    producer:
      acks: 1 # 至少Leader确认写入成功，兼顾性能与可靠性
      retries: 3 # 发送失败自动重试次数
    listener:
      type: batch # 批量消费，一批消息一次性批量写入InfluxDB
      ack-mode: manual_immediate # 手动提交偏移量，写入成功后立即提交
      missing-topics-fatal: false # Topic不存在时不阻断应用启动（仅告警）

# kafka topic名称（应用启动时会自动创建以下Topic）
kafka:
  topic:
    telemetry-data: telemetry-data
    iot-device-conn: iot-device-conn
    iot-heartbeat: iot-heartbeat
    dlq: dlq-iot # 消费失败死信Topic


# MyBatis-Plus
mybatis-plus:
  # 多模块 Mapper XML：iot 与 user 子目录均需加载，故使用 classpath*: + ** 通配
  mapper-locations: classpath*:mapper/**/*.xml
  # 实体别名扫描包（IoT 设备域 + 用户认证域）
  type-aliases-package: com.dboat.iot.entity,com.dboat.user.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MQTT (EMQX Broker)
mqtt:
  broker-url: tcp://localhost:1883
  client-id: iot-pilot-server
  username: admin
  password: public
  connection-timeout: 30
  keep-alive-interval: 60
  automatic-reconnect: true
  clean-session: true
  subscribe-topics:
    - iot/sensor/upload/+
    - iot/device/status/+
  subscribe-qos:
    - 1
  webHookSwitch: true
  # 直连订阅模式开关（遥测数据入库链路二选一，避免重复写入）：
  #   true  = 后端直连订阅 EMQX，遥测数据直接写入 InfluxDB
  #   false = EMQX 规则引擎将遥测数据转发至 Kafka，后端消费 Kafka 批量写入 InfluxDB
  directSubscribeSwitch: false


# InfluxDB
influxdb:
  url: http://localhost:8086
  token: your-influxdb-token
  org-name: iot
  bucket: sensor
  log-level: BASIC


# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    com.dboat.iot: DEBUG
    com.dboat.user: DEBUG
    org.eclipse.paho: INFO
    # Kafka客户端日志降噪，避免大量心跳/拉取日志刷屏（问题排查时可临时调为INFO）
    org.apache.kafka: WARN
    # Spring Security 日志降噪（排查鉴权问题时可临时调为 DEBUG）
    org.springframework.security: INFO
    # 打印mapper接口所在包日志，会输出：执行SQL、参数、返回条数
    com.dboat.iot.mapper: DEBUG
    com.dboat.user.mapper: DEBUG
    # 核心：mybatis底层日志，展示完整SQL语句
    org.mybatis: DEBUG



#Thread pool
thread-pool:
  common:
    core-size: 4
    max-size: 16
    queue-capacity: 500
    keep-alive-seconds: 60
  ws-push:
    core-size: 4
    max-size: 12
    queue-capacity: 800
    keep-alive-seconds: 60
  redis-relay:
    core-size: 4
    max-size: 12
    queue-capacity: 300
    keep-alive-seconds: 60


# ========== 认证鉴权体系配置（双令牌 + RBAC + 多租户） ==========
auth:
  jwt:
    # 签发方标识，验签时会校验 iss 必须一致
    issuer: home-pilot
    # Access Token 有效期（秒）—— 无状态 JWT，建议 30min~2h
    access-token-ttl-seconds: 7200
    # Refresh Token 有效期（秒）—— Redis 有状态，可撤销可轮换，默认 7 天
    refresh-token-ttl-seconds: 604800
    # 签名算法固定 RS256，密钥长度 2048
    rsa-key-size: 2048
    # RSA 私钥（PKCS#8 PEM，可多行）。为空则启动时生成临时密钥对，仅适用于开发环境
    # 生产环境必须配置固定密钥，否则重启后已签发的 Access Token 全部失效
    private-key:
    # RSA 公钥（X.509 PEM）。为空时从私钥/临时密钥对中推导
    public-key:
  login:
    # 连续密码错误次数阈值，达到后锁定账号
    max-fail-count: 5
    # 账号锁定时长（分钟）
    lock-minutes: 10
    # 单用户最大并发会话数，超限踢掉最早登录的会话
    max-sessions: 5
    # 登录成功后是否要求首次登录强制改密（user.first_login=1）
    force-change-password-on-first-login: true
  captcha:
    # 验证码长度
    length: 6
    # 验证码有效期（秒）
    ttl-seconds: 300
    # 同一目标发送间隔（秒），防刷
    send-interval-seconds: 60
    # 模拟发送开关：true 时验证码直接写入日志并在接口响应中返回（仅限开发环境）
    mock-enabled: true
  rate-limit:
    # 认证接口限流开关
    enabled: true
    # 统计窗口（秒）
    window-seconds: 60
    # 单 IP 在窗口内允许的最大请求数
    max-requests: 30
  cache:
    # 角色/权限集合缓存有效期（秒），权限变更时主动失效
    perm-ttl-seconds: 1800
    # 令牌版本号缓存有效期（秒）
    token-version-ttl-seconds: 300
  security:
    # 免认证白名单路径（设备侧回调、WebSocket、文档、认证入口）
    permit-all-paths:
      - /api/auth/login
      - /api/auth/register
      - /api/auth/refresh
      - /api/auth/captcha/send
      - /api/emqx/**
      - /ws
      - /ws/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /doc.html
      - /error
