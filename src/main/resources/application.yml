server:
  port: 8080

app:
  node-id: home-pilot-001

spring:
  application:
    name: home-pilot
  profiles:
    active: local-vm
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/iot?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    # ========== HikariCP 连接池生产级配置 ==========
    hikari:
      # 连接池名称（便于监控和日志识别）
      pool-name: home-pilot-hikari
      # 最大连接数（根据 MySQL max_connections 和业务并发量调整）
      maximum-pool-size: 20
      # 最小空闲连接数（保持预热，避免突发流量时冷启动建连开销）
      minimum-idle: 5
      # 获取连接最大等待时间（超时抛 SQLException）
      connection-timeout: 30000
      # 空闲连接存活最大时间（MySQL wait_timeout 必须大于此值，建议 MySQL 侧设 600s+）
      idle-timeout: 600000
      # 连接最大生命周期（必须小于 MySQL wait_timeout，防止使用已被服务端关闭的死连接）
      max-lifetime: 1800000
      # 连接有效性检测 SQL（MySQL 推荐用此轻量级语句）
      connection-test-query: SELECT 1
      # 自动提交行为
      auto-commit: true
      # 连接泄漏检测阈值（超过此时间未归还的连接视为泄漏，0=禁用）
      leak-detection-threshold: 60000
  data:
    redis:
      host: localhost
      port: 6379
      # password:
      password: 123
      database: 0
      # 命令响应超时（读取数据时最大等待时间）
      timeout: 3000ms
      # TCP 连接建立超时（握手阶段）
      connect-timeout: 3000ms
      # 客户端名称，便于在 Redis INFO clients 中识别来源
      client-name: home-pilot
      lettuce:
        pool:
          # 连接池最大连接数（根据业务并发量调整，IoT 场景设备状态读写频繁）
          max-active: 16
          # 最大空闲连接（长期保持的可回收连接数）
          max-idle: 8
          # 最小空闲连接（预热保活，避免突发流量时冷启动建连）
          min-idle: 2
          # 从连接池获取连接的最大等待时间，超时抛异常
          max-wait: 2000ms
        # 关闭超时：优雅关闭连接时等待命令完成的最大时间
        shutdown-timeout: 200ms
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    consumer:
      group-id: backend-group-iot
      enable-auto-commit: false # 关闭自动提交！业务处理完手动commit
      auto-offset-reset: latest
      max-poll-records: 200 # 一次拉取一批消息，方便批量写influxdb
    producer:
      acks: 1 # 至少Leader确认写入成功，兼顾性能与可靠性
      retries: 3 # 发送失败自动重试次数
    listener:
      type: batch # 批量消费，一批消息一次性批量写入InfluxDB
      ack-mode: manual_immediate # 手动提交偏移量，写入成功后立即提交
      missing-topics-fatal: false # Topic不存在时不阻断应用启动（仅告警）

# kafka topic名称（应用启动时会自动创建以下Topic）
kafka:
  topic:
    telemetry-data-topic: telemetry-data # 传感器遥测数据Topic
    dlq: dlq-iot # 消费失败死信Topic


# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.dboat.iot.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# MQTT (EMQX Broker)
mqtt:
  broker-url: tcp://localhost:1883
  client-id: home-pilot-server
  username: admin
  password: public
  connection-timeout: 30
  keep-alive-interval: 60
  automatic-reconnect: true
  clean-session: true
  subscribe-topics:
    - iot/sensor/upload/+
    - iot/device/status/+
  subscribe-qos:
    - 1
  webHookSwitch: true
  # 直连订阅模式开关（遥测数据入库链路二选一，避免重复写入）：
  #   true  = 后端直连订阅 EMQX，遥测数据直接写入 InfluxDB
  #   false = EMQX 规则引擎将遥测数据转发至 Kafka，后端消费 Kafka 批量写入 InfluxDB
  directSubscribeSwitch: false


# InfluxDB
influxdb:
  url: http://localhost:8086
  token: your-influxdb-token
  org-name: iot
  bucket: sensor
  log-level: BASIC


# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Logging
logging:
  level:
    com.dboat.iot: DEBUG
    org.eclipse.paho: INFO
    # Kafka客户端日志降噪，避免大量心跳/拉取日志刷屏（问题排查时可临时调为INFO）
    org.apache.kafka: WARN
    # 打印mapper接口所在包日志，会输出：执行SQL、参数、返回条数
    com.dboat.iot.mapper: DEBUG
    # 核心：mybatis底层日志，展示完整SQL语句
    org.mybatis: DEBUG



#Thread pool
thread-pool:
  common:
    core-size: 4
    max-size: 16
    queue-capacity: 500
    keep-alive-seconds: 60
  ws-push:
    core-size: 4
    max-size: 12
    queue-capacity: 800
    keep-alive-seconds: 60
  redis-relay:
    core-size: 4
    max-size: 12
    queue-capacity: 300
    keep-alive-seconds: 60
